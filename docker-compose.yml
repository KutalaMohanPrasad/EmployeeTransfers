version: '3.1'

services:
  # PostgreSQL Database Service
  postgres17:
    image: postgres:17
    container_name: postgres17
    hostname: postgres17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: employee_db
    ports:
      - "5432:5432"
    volumes:
      # Mount the setup script to initialize database
      - ./setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Spring Boot Application Service
  app:
    image: employee-transfers:0.0.1
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: employee-transfers-app
    depends_on:
      postgres17:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: postgres17
      DB_NAME: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      
      # Spring Boot Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres17:5432/employee_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    restart: unless-stopped

# Define persistent volumes
volumes:
  postgres_data:
    driver: local

# Define custom network
networks:
  app-network:
    driver: bridge

